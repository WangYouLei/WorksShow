# ============================================================
# WorksShow 后端配置
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: worksshow-backend
  # Redis 配置 - 用于 token 黑名单存储
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  # 数据源配置 - 请根据本地 MySQL 实际情况修改 username / password
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/works_show?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    # 生产环境务必通过环境变量 DB_USERNAME / DB_PASSWORD 注入,使用最小权限账号
    username: root
    password: 123456
  # JSON 序列化: 统一返回 GMT+8 时区
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 邮件配置 - 用于发送邮箱验证码
  # 请填入实际的邮箱 SMTP 信息(以 QQ 邮箱为例,其他邮箱修改 host 即可):
  #   1. QQ 邮箱: host=smtp.qq.com, password 为授权码(非登录密码)
  #   2. 163 邮箱: host=smtp.163.com
  #   3. Gmail: host=smtp.gmail.com
  # 也可通过环境变量 MAIL_HOST / MAIL_USERNAME / MAIL_PASSWORD 注入
  mail:
    host: smtp.qq.com
    port: 587
    username: ${QQ_mail}
    password: ${QQ_SMTP/IMAP}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Mybatis-Plus 配置
mybatis-plus:
  configuration:
    # SQL 日志: 开发期输出到控制台,生产环境请改为 slf4j 或关闭
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略: 数据库自增(配合 user 表 AUTO_INCREMENT)
      id-type: AUTO
      # 逻辑删除字段配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # Mapper XML 路径(本工程使用注解开发,预留扩展)
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token 配置 (文档: https://sa-token.cc)
sa-token:
  # token 名称(同时也是 Cookie/Header 名),沿用原 Authorization 头
  token-name: Authorization
  # token 前缀: 请求头格式为 "Authorization: Bearer xxx",sa-token 自动剥离前缀
  token-prefix: Bearer
  # token 有效期(单位: 秒): 15 分钟(缩短有效期降低泄漏窗口,配合 refresh token 使用)
  timeout: 900
  # token 最低活跃频率(单位: 秒),-1 代表不限制,永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 (true 允许一起登录,false 新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时,是否共用一个 token (true 共用,false 每次登录新建)
  is-share: false
  # token 风格: jwt (StateLess 模式必须)
  token-style: jwt
  # 是否输出操作日志
  is-log: false
  # JWT 签名密钥,生产环境务必通过环境变量 JWT_SECRET 注入强随机密钥
  jwt-secret-key: ${JWT_SECRET:worksshow-secret-key-for-jwt-signing-2026}

# EdgeOne Pages 部署配置
edgeone:
  # AES 加密密钥(用于加解密用户的 EdgeOne API Token)
  # 生产环境务必通过环境变量 EDGEONE_ENCRYPT_KEY 注入强随机密钥
  encrypt-key: ${EDGEONE_ENCRYPT_KEY:worksshow-edgeone-default-aes-key-2026}

logging:
  level:
    com.worksshow: debug
