# ============================================================
# WorksShow 后端配置
# ============================================================
server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: worksshow-backend
  # 未显式激活 profile 时默认使用 dev(本地开发)。
  # 生产环境必须设置 SPRING_PROFILES_ACTIVE=prod 等非 dev 值,
  # 届时密钥/凭据仅从环境变量读取,缺失将启动失败(fail-fast)
  profiles:
    default: dev
  # Redis 配置 - 用于 token 黑名单存储
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms
  # 数据源配置 - 请根据本地 MySQL 实际情况修改 username / password
  # 凭据仅从环境变量注入(dev profile 提供本地开发默认值),不随源码泄漏生产凭据
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/works_show?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    # 生产环境务必通过环境变量 DB_USERNAME / DB_PASSWORD 注入,使用最小权限账号
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # JSON 序列化: 统一返回 GMT+8 时区
  jackson:
    time-zone: GMT+8
    date-format: yyyy-MM-dd HH:mm:ss
  # 邮件配置 - 用于发送邮箱验证码
  # 请填入实际的邮箱 SMTP 信息(以 QQ 邮箱为例,其他邮箱修改 host 即可):
  #   1. QQ 邮箱: host=smtp.qq.com, password 为授权码(非登录密码)
  #   2. 163 邮箱: host=smtp.163.com
  #   3. Gmail: host=smtp.gmail.com
  # 也可通过环境变量 MAIL_HOST / MAIL_USERNAME / MAIL_PASSWORD 注入
  mail:
    host: smtp.qq.com
    port: 587
    username: ${QQ_mail}
    password: ${QQ_SMTP/IMAP}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Mybatis-Plus 配置
mybatis-plus:
  configuration:
    # SQL 日志:默认关闭。开发期在 application-dev.yml 覆盖为 StdOutImpl,
    # 生产应用 application-prod.yml 保持默认(关闭),避免 SQL 文本随响应日志泄漏
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      # 主键策略: 数据库自增(配合 user 表 AUTO_INCREMENT)
      id-type: AUTO
      # 逻辑删除字段配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # Mapper XML 路径(本工程使用注解开发,预留扩展)
  mapper-locations: classpath*:/mapper/**/*.xml

# Sa-Token 配置 (文档: https://sa-token.cc)
sa-token:
  # token 名称(同时也是 Cookie/Header 名),沿用原 Authorization 头
  token-name: Authorization
  # token 前缀: 请求头格式为 "Authorization: Bearer xxx",sa-token 自动剥离前缀
  token-prefix: Bearer
  # token 有效期(单位: 秒): 15 分钟(缩短有效期降低泄漏窗口,配合 refresh token 使用)
  timeout: 900
  # token 最低活跃频率(单位: 秒),-1 代表不限制,永不冻结
  active-timeout: -1
  # 是否允许同一账号多地同时登录 (true 允许一起登录,false 新登录挤掉旧登录)
  is-concurrent: true
  # 在多人登录同一账号时,是否共用一个 token (true 共用,false 每次登录新建)
  is-share: false
  # 仅从 Header 读取 token,禁止 Cookie 传递:
  # token 黑名单按 Header token 校验,若允许 Cookie 传 token 会被绕过
  is-read-cookie: false
  # token 风格: jwt (StateLess 模式必须)
  token-style: jwt
  # 是否输出操作日志
  is-log: false
  # JWT 签名密钥:仅从环境变量 JWT_SECRET 注入强随机密钥,无默认值。
  # 缺失时启动失败(带默认值的密钥会随源码泄漏,可被用于伪造任意用户 token)
  jwt-secret-key: ${JWT_SECRET}

# EdgeOne Pages 部署配置
edgeone:
  # AES 加密密钥(用于加解密用户的 EdgeOne API Token)
  # 仅从环境变量 EDGEONE_ENCRYPT_KEY 注入强随机密钥,无默认值,缺失时启动失败
  encrypt-key: ${EDGEONE_ENCRYPT_KEY}

# AI 对话配置(任意 OpenAI 兼容接口,默认阿里云百炼 DashScope 兼容模式)
# 密钥仅从环境变量 AI_API_KEY 注入;dev profile 下回落到本地环境变量
ai:
  base-url: ${AI_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
  api-key: ${AI_API_KEY:}
  model: ${AI_MODEL:qwen-plus}
  max-tokens: ${AI_MAX_TOKENS:1500}
  temperature: ${AI_TEMPERATURE:0.3}
  # 每个用户每日对话次数上限
  daily-limit: ${AI_DAILY_LIMIT:30}
  # AI 模板生成:每日次数上限与单次输出 token 上限
  template-daily-limit: ${AI_TEMPLATE_DAILY_LIMIT:5}
  template-max-tokens: ${AI_TEMPLATE_MAX_TOKENS:8000}
  # 流式读取超时(秒)
  timeout-seconds: ${AI_TIMEOUT_SECONDS:120}

# 本服务器部署配置(简历 HTML 落盘并由本服务公开提供访问)
local-deploy:
  # 站点文件存储目录(相对路径基于服务运行目录,部署时自动创建)
  dir: ${LOCAL_DEPLOY_DIR:./local-sites}
  # 站点对外基础地址(含 context-path /api,如 https://example.com/api)
  # 为空时按当前请求动态构造;反向代理(nginx 等)后建议显式配置为公网地址
  base-url: ${LOCAL_DEPLOY_BASE_URL:}

# Logging:默认 INFO。开发期在 application-dev.yml 覆盖为 debug + StdOutImpl,
# 生产环境保持默认(仅输出 warn/error),避免 SQL 与业务细节随日志泄漏
# logging.level:
#   com.worksshow: info
